name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check formatting
        run: python -m black --check analysis.py polars_analysis.py test_analysis.py

      - name: Run lint checks
        run: python -m flake8 --config=.flake8 analysis.py polars_analysis.py test_analysis.py

      - name: Run tests
        run: python -m pytest -v

      - name: Run Pandas analysis
        run: python analysis.py

      - name: Run Polars analysis
        run: python polars_analysis.py